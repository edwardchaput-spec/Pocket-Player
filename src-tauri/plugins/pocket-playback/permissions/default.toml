"$schema" = "schemas/schema.json"

[default]
description = "Allows the main window to drive native Android playback."
permissions = [
  "allow-subscribe",
  "allow-configure",
  "allow-set-queue",
  "allow-play",
  "allow-pause",
  "allow-seek-to",
  "allow-skip-to",
  "allow-set-volume",
  "allow-set-repeat-mode",
  "allow-set-spectrum-enabled",
  "allow-stop",
]
