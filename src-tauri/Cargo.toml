[package]
name = "navidrome-desktop"
version = "0.1.0"
description = "Pocket Player — A Navidrome Revolution"
authors = ["Pocket Player contributors"]
edition = "2024"

[lib]
name = "navidrome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
md-5 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.11.0"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2.4.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
httpmock = "0.8.3"
tokio = { version = "1.47.1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
